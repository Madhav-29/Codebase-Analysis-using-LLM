# Manual review of LLM findings (spring-rest-sakila @ 62873f7). Scored by `codebase-analyzer eval`.
review_scope: LLM findings with category potential_bug and severity medium or high
categories:
  valid_bug: The code fails or misbehaves as described.
  valid_improvement: Accurate and worth changing, but not a defect.
  style_opinion: Accurate, but a matter of convention or defensive style.
  false_positive: The claim about the code is wrong.

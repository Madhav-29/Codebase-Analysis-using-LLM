# Golden methods for evaluating LLM method descriptions (spring-rest-sakila @ 62873f7).
# Chosen across 8 domains: the most complex non-trivial methods (CC 3-5) plus the longest
# service and repository logic. Verdicts are human judgments against the source;
# `codebase-analyzer eval <analysis.json> --repo <target>` renders the review sheet and scores them.
rubric:
  correct: States what the method does, including the branches and side effects a reader needs; nothing false.
  partially_correct: The main behavior is right, but a path or side effect a reader needs is missing or imprecisely described.
  incorrect: Gets the main behavior wrong, or states the opposite of what a path does.


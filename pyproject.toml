[project]
name = "codebase-analyzer"
version = "0.1.0"
description = "LLM-powered structured knowledge extraction for Java/Spring codebases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "lizard>=1.17",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]

[project.scripts]
codebase-analyzer = "codebase_analyzer.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "codebase-analyzer"
version = "1.0.0"
description = "LLM-powered structured knowledge extraction for Java/Spring codebases"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Madhav Sai Avanigadda" }]
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "lizard>=1.17",
    "langchain-core>=1.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
    "langchain-google-genai>=4.4.2",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.7.6",
]
azure = [
    "langchain-azure-ai>=1.2.10",
]

[project.urls]
Repository = "https://github.com/Madhav-29/codebase-analysis-using-llm"

[project.scripts]
codebase-analyzer = "codebase_analyzer.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_analyzer"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]
ignore = [
    "E501",   # line length is the formatter's job; long string literals (prompt text) are allowed
    "PT018",  # composite assertions in tests read as one claim
]

[tool.ruff.lint.isort]
known-first-party = ["codebase_analyzer"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lizard", "tree_sitter_java", "langchain_azure_ai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # google-genai uses a typing alias deprecated in Python 3.14; not ours to fix.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["codebase_analyzer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['raise AssertionError\("unreachable"\)']
